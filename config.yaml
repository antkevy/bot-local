geral:
  intervalo_minutos: 45
  max_posts_por_ciclo: 3
  espacamento_segundos: 120
  nao_repetir_dias: 7
  horario_ativo: ''
publicacao:
  intervalo_entre_posts_segundos: 0
  posts_antes_pausa: 0
  tempo_pausa_segundos: 0
  max_posts_periodo: 0
  periodo_horas: 24
filtros:
  avaliacao_minima: 4.7
  vendas_minimas: 100
  desconto_minimo: 0
  permitir_sem_desconto: true
  permitir_sem_avaliacao: true
  permitir_sem_vendas: true
  preco_minimo: 0.0
  preco_maximo: 0.0
  palavras_bloqueadas: []
scraping_telegram:
  ativo: true
  intervalo_segundos: 30
  max_mensagens_por_ciclo: 50
fontes:
  mercadolivre:
    ativa: true
    paginas: 1
    categorias: {}
  amazon:
    ativa: true
    paginas: 1
    requisicoes_por_ciclo: 4
    departamentos: {}
    buscas: []
  shopee:
    ativa: true
    limite: 40
    buscas: []
  aliexpress:
    ativa: true
    limite: 30
    buscas: []
  telegram:
    ativa: true
    canais: []
    dry_run: false
  # Feed de alertas do alerta.nerdofertas.com (site próprio). Cada alerta entra
  # pelo mesmo caminho das mensagens do Telegram: o link é reconvertido pelo
  # conversor da plataforma (link de afiliado do dono) e cupom/preço saem do
  # texto. `ignorar_canais` recebe o username t.me dos canais que são o próprio
  # destino — sem isso, o bot republicaria o que o canal já publicou.
  nerdofertas:
    ativa: true
    slug: nerdavisosbot
    ignorar_canais:
      - nerdofertas
    dry_run: false
